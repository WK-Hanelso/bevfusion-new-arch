# S1 — LiDAR-only DSVT + TransFusion head (BEVFusion-style stage 1).
# Backbone initialised from the official DSVT nuScenes checkpoint (--load_from);
# head/decoder train from scratch. Its checkpoint initialises the DSVT fusion
# arms (A1/C1/P2/FINAL), as BEVFusion initialises fusion from lidar-only.pth.
voxel_size: [0.3, 0.3, 8.0]

input_modality:
  use_lidar: true
  use_camera: false
  use_radar: false
  use_map: false
  use_external: false

train_pipeline:
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: false
  -
    type: GlobalRotScaleTrans
    resize_lim: ${augment3d.scale}
    rot_lim: ${augment3d.rotate}
    trans_lim: ${augment3d.translate}
    is_train: true
  -
    type: RandomFlip3D
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectNameFilter
    classes: ${object_classes}
  -
    type: PointShuffle
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys: [points, gt_bboxes_3d, gt_labels_3d]
    meta_keys:
      - lidar2ego
      - lidar_aug_matrix

test_pipeline:
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: false
  -
    type: GlobalRotScaleTrans
    resize_lim: [1.0, 1.0]
    rot_lim: [0.0, 0.0]
    trans_lim: 0.0
    is_train: false
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys: [points, gt_bboxes_3d, gt_labels_3d]
    meta_keys:
      - lidar2ego
      - lidar_aug_matrix

model:
  encoders:
    camera: null
    lidar:
      type: DSVTLidarEncoder
      in_channels: 5
      point_cloud_range: ${point_cloud_range}
      voxel_size: ${voxel_size}
      d_model: 128
      set_size: 90
      block_count: 4
      window_shape: [30, 30, 1]
      out_channels: 256
      official_layout: true
      zero_feature_channels: [4]
  fuser: null
  heads:
    object:
      train_cfg:
        grid_size: [360, 360, 1]
        out_size_factor: 2
      test_cfg:
        grid_size: [360, 360, 1]
        out_size_factor: 2
      bbox_coder:
        out_size_factor: 2
