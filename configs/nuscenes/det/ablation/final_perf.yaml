# FINAL, performance recipe ("train it properly"): everything the screening
# family deliberately left out for edge parity, switched back on.
#   - 10 LiDAR sweeps (LoadPointsFromMultiSweeps, sweeps_num 9 + key frame)
#   - GT-Aug (ObjectPaste from nuscenes_dbinfos_train.pkl), faded in the last epoch
#   - ResNet-50 camera backbone (ImageNet init), LSSFPN in_channels [1024, 512]
#   - 20 epochs, batch 32, same lr for every module (no DSVT lr_mult; the
#     screening-era 0.1x was a workaround for the BEV-layout bug, now fixed)
# Requires nuscenes_dbinfos_train.pkl + nuscenes_gt_database/ under dataset_root.
# Inherits everything else from dsvt1_wf1_gf1_dal1.yaml (DSVT + WidthFormer + DepthGFusion + DAL).

voxel_size:
- 0.3
- 0.3
- 8.0
model:
  encoders:
    lidar:
      type: DSVTLidarEncoder
      in_channels: 5
      point_cloud_range: ${point_cloud_range}
      voxel_size: ${voxel_size}
      d_model: 128
      set_size: 90
      block_count: 4
      window_shape:
      - 30
      - 30
      - 1
      out_channels: 256
      official_layout: true
      zero_feature_channels:
      - 4
    camera:
      vtransform:
        type: WidthFormerTransform
        in_channels: 256
        out_channels: 80
        image_size: ${image_size}
        feature_size: ${[image_size[0] // 16, image_size[1] // 16]}
        xbound:
        - -54.0
        - 54.0
        - 0.6
        ybound:
        - -54.0
        - 54.0
        - 0.6
        zbound:
        - -10.0
        - 10.0
        - 20.0
        dbound:
        - 1.0
        - 60.0
        - 1.0
        ffn_channels: 320
        attention_chunk_size: 0
        positional_scale: 10.0
      backbone:
        type: ResNet
        depth: 50
        out_indices:
        - 1
        - 2
        - 3
        init_cfg:
          type: Pretrained
          checkpoint: https://download.pytorch.org/models/resnet50-0676ba61.pth
      neck:
        type: LSSFPN
        in_indices:
        - 2
        - 1
        in_channels:
        - 2048
        - 1024
        out_channels: 256
        scale_factor: 1
  fuser:
    type: DepthGFusion
    in_channels:
    - 80
    - 256
    out_channels: 256
    embed_channels: 256
    patch_hidden_channels: 640
    num_heads: 8
    patch_size: 5
    attention_downsample: 4
    xbound:
    - -54.0
    - 54.0
    - 0.6
    ybound:
    - -54.0
    - 54.0
    - 0.6
    camera_layout: yx
    lidar_layout: yx
  heads:
    object:
      type: DALDecoupledHead
      lidar_in_channels: 256
      train_cfg:
        grid_size:
        - 360
        - 360
        - 1
        out_size_factor: 2
      test_cfg:
        grid_size:
        - 360
        - 360
        - 1
        out_size_factor: 2
      bbox_coder:
        out_size_factor: 2
lidar_sweeps: 9
gt_paste_stop_epoch: 19
train_pipeline:
- type: LoadMultiViewImageFromFiles
  to_float32: true
- type: LoadPointsFromFile
  coord_type: LIDAR
  load_dim: ${load_dim}
  use_dim: ${use_dim}
  reduce_beams: ${reduce_beams}
  load_augmented: ${load_augmented}
- type: LoadPointsFromMultiSweeps
  sweeps_num: ${lidar_sweeps}
  load_dim: ${load_dim}
  use_dim: ${use_dim}
  reduce_beams: ${reduce_beams}
  pad_empty_sweeps: true
  remove_close: true
  load_augmented: ${load_augmented}
- type: LoadAnnotations3D
  with_bbox_3d: true
  with_label_3d: true
  with_attr_label: false
- type: ObjectPaste
  stop_epoch: ${gt_paste_stop_epoch}
  db_sampler:
    dataset_root: ${dataset_root}
    info_path: ${dataset_root + "nuscenes_dbinfos_train.pkl"}
    rate: 1.0
    prepare:
      filter_by_difficulty:
      - -1
      filter_by_min_points:
        car: 5
        truck: 5
        bus: 5
        trailer: 5
        construction_vehicle: 5
        traffic_cone: 5
        barrier: 5
        motorcycle: 5
        bicycle: 5
        pedestrian: 5
    classes: ${object_classes}
    sample_groups:
      car: 2
      truck: 3
      construction_vehicle: 7
      bus: 4
      trailer: 6
      barrier: 2
      motorcycle: 6
      bicycle: 6
      pedestrian: 2
      traffic_cone: 2
    points_loader:
      type: LoadPointsFromFile
      coord_type: LIDAR
      load_dim: ${load_dim}
      use_dim: ${use_dim}
      reduce_beams: ${reduce_beams}
- type: ImageAug3D
  final_dim: ${image_size}
  resize_lim: ${augment2d.resize[0]}
  bot_pct_lim:
  - 0.0
  - 0.0
  rot_lim: ${augment2d.rotate}
  rand_flip: true
  is_train: true
- type: GlobalRotScaleTrans
  resize_lim: ${augment3d.scale}
  rot_lim: ${augment3d.rotate}
  trans_lim: ${augment3d.translate}
  is_train: true
- type: RandomFlip3D
- type: PointsRangeFilter
  point_cloud_range: ${point_cloud_range}
- type: ObjectRangeFilter
  point_cloud_range: ${point_cloud_range}
- type: ObjectNameFilter
  classes: ${object_classes}
- type: PointShuffle
- type: ImageNormalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: DefaultFormatBundle3D
  classes: ${object_classes}
- type: Collect3D
  keys:
  - img
  - points
  - gt_bboxes_3d
  - gt_labels_3d
  meta_keys:
  - camera_intrinsics
  - camera2ego
  - lidar2ego
  - lidar2camera
  - camera2lidar
  - lidar2image
  - img_aug_matrix
  - lidar_aug_matrix
test_pipeline:
- type: LoadMultiViewImageFromFiles
  to_float32: true
- type: LoadPointsFromFile
  coord_type: LIDAR
  load_dim: ${load_dim}
  use_dim: ${use_dim}
  reduce_beams: ${reduce_beams}
  load_augmented: ${load_augmented}
- type: LoadPointsFromMultiSweeps
  sweeps_num: ${lidar_sweeps}
  load_dim: ${load_dim}
  use_dim: ${use_dim}
  reduce_beams: ${reduce_beams}
  pad_empty_sweeps: true
  remove_close: true
  load_augmented: ${load_augmented}
- type: LoadAnnotations3D
  with_bbox_3d: true
  with_label_3d: true
  with_attr_label: false
- type: ImageAug3D
  final_dim: ${image_size}
  resize_lim: ${augment2d.resize[1]}
  bot_pct_lim:
  - 0.0
  - 0.0
  rot_lim:
  - 0.0
  - 0.0
  rand_flip: false
  is_train: false
- type: GlobalRotScaleTrans
  resize_lim:
  - 1.0
  - 1.0
  rot_lim:
  - 0.0
  - 0.0
  trans_lim: 0.0
  is_train: false
- type: PointsRangeFilter
  point_cloud_range: ${point_cloud_range}
- type: ImageNormalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: DefaultFormatBundle3D
  classes: ${object_classes}
- type: Collect3D
  keys:
  - img
  - points
  - gt_bboxes_3d
  - gt_labels_3d
  meta_keys:
  - camera_intrinsics
  - camera2ego
  - lidar2ego
  - lidar2camera
  - camera2lidar
  - lidar2image
  - img_aug_matrix
  - lidar_aug_matrix
